<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Stats</title>
    <!-- meta -->
    <meta name="description" content="">
    <meta name="author" content="">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <!-- styles -->
    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', filename='styles.css')}}">
    {% block css %}{% endblock %}
</head>

<body>
    {% include "influencer/navbar.html" %}
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-6 mb-4 d-flex justify-content-center align-items-center">
                <div class="card" style="width: 100%;">
                    <div class="card-body">
                        <canvas id="chart1"></canvas>
                    </div>
                    <h5 class="card-title text-center">Ad Requests Count</h5>
                </div>
            </div>
            <div class="col-md-6 mb-4 d-flex justify-content-center align-items-center">
                <div class="card" style="width: 100%;">
                    <div class="card-body">
                        <canvas id="chart4"></canvas>
                    </div>
                    <h5 class="card-title text-center">Ad Requests status</h5>
                </div>
            </div>
        </div>
    </div>

    </div>

    <!-- scripts -->
    <script src="https://code.jquery.com/jquery-3.6.1.min.js" type="text/javascript"></script>
    <!-- JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
        crossorigin="anonymous"></script>
    <script>
        function openFullscreen(img) {
            const fullscreenDiv = document.createElement('div');
            fullscreenDiv.style.position = 'fixed';
            fullscreenDiv.style.top = '0';
            fullscreenDiv.style.left = '0';
            fullscreenDiv.style.width = '100%';
            fullscreenDiv.style.height = '100%';
            fullscreenDiv.style.backgroundColor = 'rgba(0, 0, 0, 0.9)';
            fullscreenDiv.style.display = 'flex';
            fullscreenDiv.style.alignItems = 'center';
            fullscreenDiv.style.justifyContent = 'center';
            fullscreenDiv.style.zIndex = '1000';
            fullscreenDiv.onclick = () => document.body.removeChild(fullscreenDiv);

            const fullImg = document.createElement('img');
            fullImg.src = img.src;
            fullImg.style.maxWidth = '100%';
            fullImg.style.maxHeight = '100%';

            fullscreenDiv.appendChild(fullImg);
            document.body.appendChild(fullscreenDiv);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const stats = JSON.parse('{{ stats | tojson | safe }}');
        // Sample data for the charts
        const data = {
            labels: ['Rejected', 'Completed', 'Accepted'],
            datasets: [{
                data: [300, 50, 100],
                backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56'],
                hoverBackgroundColor: ['#FF6384', '#36A2EB', '#FFCE56']
            }]
        };

        const ad_request_line_chart_data = {
            labels: stats.daily_ad_requests.labels,
            datasets: [{
                label: 'Ad Requests',
                data: stats.daily_ad_requests.values,
                fill: false,
                borderColor: 'rgb(75, 192, 192)',
                tension: 0.1
            }]
        };

        const ad_request_status_data = {
            labels: ['Rejected', 'Completed', 'Accepted'],
            datasets: [{
                data: stats.ad_request_stats,
                backgroundColor: ['#FF6384', '#36A2EB', '#4CAF50'],
                hoverBackgroundColor: ['#FF6384', '#36A2EB', '#4CAF50']
            }]
        };

        // Chart options
        const options = {
            responsive: true,
            maintainAspectRatio: false
        };

        // Create the charts
        const ctx1 = document.getElementById('chart1').getContext('2d');
        const chart1 = new Chart(ctx1, {
            type: 'line',
            data: ad_request_line_chart_data,
            options: options
        });

        const ctx4 = document.getElementById('chart4').getContext('2d');
        const chart4 = new Chart(ctx4, {
            type: 'pie',
            data: ad_request_status_data,
            options: options
        });

    </script>
    {% block js %}{% endblock %}

</body>

</html>
